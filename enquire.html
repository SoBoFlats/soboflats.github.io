<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting… · Oswal Properties</title>
<script>
(function(){
  var sp=new URLSearchParams(window.location.search);
  var flow=sp.get('flow');
  var serial=sp.get('serial');
  var dest='index.html';
  if(flow==='listingdetails') dest='queries.html';
  else if(flow==='requirement') dest='requirement.html';
  if(serial) dest+=(dest.indexOf('?')>=0?'&':'?')+'serial='+serial;
  window.location.replace(dest);
})();
</script>
<meta http-equiv="refresh" content="2;url=index.html">
</head>
<body>
<p>Redirecting… <a href="index.html">Click here</a> if not redirected.</p>
</body>
</html>
