<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>Share Listing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a1a17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .container { max-width: 600px; margin: 0 auto; padding-bottom: 100px; }
  .card-img { width: 100%; display: block; }
  .caption-box {
    background: #1a2e28; border: 1px solid #2a4a3e; border-radius: 12px;
    margin: 16px; padding: 16px; color: #e0e0e0;
    font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;
  }
  .caption-label { color: #25D366; font-size: 12px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .share-btn {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #25D366; color: white; border: none;
    border-radius: 50px; padding: 16px 32px;
    font-size: 17px; font-weight: 700;
    box-shadow: 0 4px 16px rgba(37,211,102,0.4);
    cursor: pointer; z-index: 1000;
    display: flex; align-items: center; gap: 10px;
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
  }
  .share-btn:active { transform: translateX(-50%) scale(0.96); box-shadow: 0 2px 8px rgba(37,211,102,0.3); }
  .share-btn svg { width: 22px; height: 22px; fill: white; }
  .loading { text-align: center; color: #888; padding: 40px; font-size: 16px; }
  .error { text-align: center; color: #e74c3c; padding: 40px; font-size: 16px; }
  .copy-btn {
    background: #1a2e28; border: 1px solid #2a4a3e; color: #25D366;
    border-radius: 8px; padding: 8px 16px; font-size: 13px;
    cursor: pointer; margin-top: 10px; display: inline-block;
  }
  .copy-btn:active { background: #2a4a3e; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: #25D366; color: white; padding: 12px 24px; border-radius: 8px;
    font-size: 14px; font-weight: 600; z-index: 2000;
    transition: transform 0.3s ease;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="container">
  <div id="content" class="loading">Loading listing...</div>
</div>

<div id="toast" class="toast">Copied!</div>

<script>
const params = new URLSearchParams(window.location.search);
const serial = params.get('id');
const container = document.getElementById('content');

if (!serial) {
  container.innerHTML = '<div class="error">No listing ID specified.<br>Use: ?id=249</div>';
} else {
  init(serial);
}

async function init(id) {
  const imgUrl = `${id}.jpg`;

  // Load caption from data.json
  let caption = '';
  try {
    const resp = await fetch('data.json');
    if (resp.ok) {
      const data = await resp.json();
      caption = data[id]?.caption || '';
    }
  } catch(e) {}

  // Strip download photo line from caption display
  const displayCaption = caption.split('\n').filter(l => !l.startsWith('💥 Download Photo:')).join('\n').replace(/\n{3,}/g, '\n\n').trim();

  // Build page
  let html = `<img class="card-img" src="${imgUrl}" alt="Listing #${id}" onerror="this.parentElement.innerHTML='<div class=error>Card image not found for #${id}</div>'">`;

  if (displayCaption) {
    html += `
      <div class="caption-box">
        <div class="caption-label">Caption</div>
        <div id="captionText">${escapeHtml(displayCaption)}</div>
        <button class="copy-btn" onclick="copyCaption()">📋 Copy Caption</button>
      </div>`;
  }

  container.innerHTML = html;

  // Add share button
  const btn = document.createElement('button');
  btn.className = 'share-btn';
  btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.5.5 0 00.611.611l4.458-1.495A11.96 11.96 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-2.37 0-4.567-.813-6.303-2.177l-.44-.36-3.259 1.093 1.093-3.259-.36-.44A9.96 9.96 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
  Share on WhatsApp`;
  btn.onclick = () => shareCard(id, displayCaption);
  document.body.appendChild(btn);
}

async function shareCard(id, caption) {
  const btn = document.querySelector('.share-btn');
  btn.innerHTML = '⏳ Preparing...';
  btn.disabled = true;

  try {
    // Fetch image as blob
    const resp = await fetch(`${id}.jpg`);
    const blob = await resp.blob();
    const file = new File([blob], `listing_${id}.jpg`, { type: 'image/jpeg' });

    // Try Web Share API with file (mobile)
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        text: caption
      });
    } else {
      // Fallback: open WhatsApp with caption text, download image separately
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `listing_${id}.jpg`;
      a.click();
      showToast('Image downloaded! Attach in WhatsApp manually.');

      if (caption) {
        // Also copy caption to clipboard
        try {
          await navigator.clipboard.writeText(caption);
          setTimeout(() => showToast('Caption copied to clipboard!'), 1500);
        } catch(e) {}
      }
    }
  } catch(e) {
    if (e.name !== 'AbortError') {
      showToast('Share failed. Try downloading the image manually.');
    }
  }

  btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.5.5 0 00.611.611l4.458-1.495A11.96 11.96 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-2.37 0-4.567-.813-6.303-2.177l-.44-.36-3.259 1.093 1.093-3.259-.36-.44A9.96 9.96 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg> Share on WhatsApp`;
  btn.disabled = false;
}

function copyCaption() {
  const text = document.getElementById('captionText')?.textContent || '';
  navigator.clipboard.writeText(text).then(() => showToast('Caption copied!')).catch(() => showToast('Copy failed'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
